openapi: 3.1.0
info:
  title: IncuBrix B-roll Engine API
  description: Containerized media pipeline service that turns audio/scripts into
    license-clean B-roll video.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - System
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - System
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/broll/jobs:
    post:
      summary: Create a new B-roll generation job
      operationId: create_broll_job_api_v1_broll_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      summary: Get job processing status and results
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/candidates/{scene_id}:
    get:
      summary: Get candidate B-roll clips for a scene
      operationId: get_scene_candidates_api_v1_jobs__job_id__candidates__scene_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SceneCandidateResponse'
                title: Response Get Scene Candidates Api V1 Jobs  Job Id  Candidates  Scene
                  Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/scenes/{scene_id}/clip:
    patch:
      summary: Swap candidate clip and trigger partial re-render
      operationId: swap_scene_clip_api_v1_jobs__job_id__scenes__scene_id__clip_patch
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          title: Scene Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapClipRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapClipResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs:
    get:
      summary: List all B-roll generation jobs
      operationId: list_jobs_api_v1_jobs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobListItemResponse'
                type: array
                title: Response List Jobs Api V1 Jobs Get
  /api/v1/metrics:
    get:
      summary: Get overall engine operational metrics
      operationId: get_metrics_api_v1_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobMetricsResponse'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        timestamp:
          type: string
          title: Timestamp
        version:
          type: string
          title: Version
          default: 1.0.0
      type: object
      required:
      - status
      - timestamp
      title: HealthResponse
    JobCreateRequest:
      properties:
        script_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Script Text
          description: Full script text to be spoken via TTS
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
          description: URL of pre-recorded voiceover audio file
        scenes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SceneInput'
            type: array
          - type: 'null'
          title: Scenes
          description: Pre-segmented scene list
        voice:
          type: string
          title: Voice
          description: TTS voice identifier (supports EN, HI, TA)
          default: en-US-Standard
        aspect_ratios:
          items:
            type: string
          type: array
          title: Aspect Ratios
          description: Target video aspect ratios (16:9, 9:16, 1:1)
        style:
          type: string
          title: Style
          description: Visual aesthetic style preset or prompt
          default: cinematic
        avoid:
          items:
            type: string
          type: array
          title: Avoid
          description: Visual tags or topics to exclude
        burn_in_captions:
          type: boolean
          title: Burn In Captions
          description: Whether to burn ASS subtitles directly onto the video
          default: true
        srt_captions:
          type: boolean
          title: Srt Captions
          description: Whether to generate and output an SRT file
          default: true
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Webhook URL for signed completion notifications
      type: object
      title: JobCreateRequest
    JobCreateResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Unique job identifier
        status:
          type: string
          title: Status
          description: Initial status, usually 'queued'
        message:
          type: string
          title: Message
          description: Human-readable response summary
          default: Job accepted and queued for processing
      type: object
      required:
      - job_id
      - status
      title: JobCreateResponse
    JobListItemResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        input_type:
          type: string
          title: Input Type
        script_preview:
          anyOf:
          - type: string
          - type: 'null'
          title: Script Preview
        aspect_ratios:
          items:
            type: string
          type: array
          title: Aspect Ratios
        duration_seconds:
          type: number
          title: Duration Seconds
          default: 0.0
        cost_estimate_usd:
          type: number
          title: Cost Estimate Usd
          default: 0.0
        created_at:
          type: string
          format: date-time
          title: Created At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      type: object
      required:
      - job_id
      - status
      - progress
      - input_type
      - created_at
      title: JobListItemResponse
    JobMetricsResponse:
      properties:
        total_jobs:
          type: integer
          title: Total Jobs
          default: 0
        succeeded_jobs:
          type: integer
          title: Succeeded Jobs
          default: 0
        failed_jobs:
          type: integer
          title: Failed Jobs
          default: 0
        avg_turnaround_seconds:
          type: number
          title: Avg Turnaround Seconds
          default: 0.0
        cost_per_minute_usd:
          type: number
          title: Cost Per Minute Usd
          default: 0.0
        narration_coverage_ratio:
          type: number
          title: Narration Coverage Ratio
          default: 1.0
        avg_relevance_score:
          type: number
          title: Avg Relevance Score
          default: 0.85
        repeat_clip_rate:
          type: number
          title: Repeat Clip Rate
          default: 0.0
        success_rate_percent:
          type: number
          title: Success Rate Percent
          default: 100.0
        source_distribution:
          additionalProperties:
            type: number
          type: object
          title: Source Distribution
        ratio_distribution:
          additionalProperties:
            type: number
          type: object
          title: Ratio Distribution
      type: object
      title: JobMetricsResponse
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        current_stage:
          type: string
          title: Current Stage
        aspect_ratios:
          items:
            type: string
          type: array
          title: Aspect Ratios
        scenes:
          items:
            $ref: '#/components/schemas/SceneResponse'
          type: array
          title: Scenes
        result_urls:
          additionalProperties:
            type: string
          type: object
          title: Result Urls
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - job_id
      - status
      - progress
      - current_stage
      - aspect_ratios
      - created_at
      - updated_at
      title: JobStatusResponse
    ReadyResponse:
      properties:
        status:
          type: string
          title: Status
        postgres:
          type: boolean
          title: Postgres
        redis:
          type: boolean
          title: Redis
        minio:
          type: boolean
          title: Minio
      type: object
      required:
      - status
      - postgres
      - redis
      - minio
      title: ReadyResponse
    SceneCandidateResponse:
      properties:
        id:
          type: string
          title: Id
        provider:
          type: string
          title: Provider
        external_id:
          type: string
          title: External Id
        title:
          type: string
          title: Title
        preview_url:
          type: string
          title: Preview Url
        download_url:
          type: string
          title: Download Url
        duration:
          type: number
          title: Duration
        relevance_score:
          type: number
          title: Relevance Score
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        is_selected:
          type: boolean
          title: Is Selected
          default: false
        ai_generated:
          type: boolean
          title: Ai Generated
          default: false
        licence_name:
          type: string
          title: Licence Name
        attribution:
          anyOf:
          - type: string
          - type: 'null'
          title: Attribution
      type: object
      required:
      - id
      - provider
      - external_id
      - title
      - preview_url
      - download_url
      - duration
      - relevance_score
      - licence_name
      title: SceneCandidateResponse
    SceneInput:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
          description: Narration text for this scene
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
          description: Optional direction or keywords for footage matching
      type: object
      required:
      - text
      title: SceneInput
    SceneResponse:
      properties:
        scene_id:
          type: string
          title: Scene Id
        scene_index:
          type: integer
          title: Scene Index
        text:
          type: string
          title: Text
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
        visual_query:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Query
        start_time:
          type: number
          title: Start Time
        end_time:
          type: number
          title: End Time
        duration:
          type: number
          title: Duration
        selected_clip_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Selected Clip Id
        selection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Selection Reason
        relevance_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Relevance Score
        source_choice_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Choice Reason
        ai_generated:
          type: boolean
          title: Ai Generated
          default: false
        segment_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Segment Hash
      type: object
      required:
      - scene_id
      - scene_index
      - text
      - start_time
      - end_time
      - duration
      title: SceneResponse
    SwapClipRequest:
      properties:
        candidate_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Candidate Id
          description: ID of CandidateFootage from GET candidates
        clip_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Clip Url
          description: Direct URL of user-provided replacement clip
      type: object
      title: SwapClipRequest
    SwapClipResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        scene_id:
          type: string
          title: Scene Id
        new_clip_id:
          type: string
          title: New Clip Id
        time_saved_seconds:
          type: number
          title: Time Saved Seconds
        re_render_duration_seconds:
          type: number
          title: Re Render Duration Seconds
        message:
          type: string
          title: Message
      type: object
      required:
      - job_id
      - scene_id
      - new_clip_id
      - time_saved_seconds
      - re_render_duration_seconds
      - message
      title: SwapClipResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
